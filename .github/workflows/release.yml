name: Release

# Publishes a GitHub release with binaries for every supported platform
# whenever a version tag such as v1.2.3 is pushed.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write      # create the release and upload its assets
  id-token: write      # sign the build provenance attestations
  attestations: write  # store the attestations

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Test
        run: make vet test

      - name: Build the release archives
        run: make dist VERSION="$GITHUB_REF_NAME"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Immutable releases lock their assets the moment they are
          # published, so the release is created as a draft with every
          # asset attached and only then published.
          prerelease=""
          case "$GITHUB_REF_NAME" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" dist/* \
            --draft --verify-tag --generate-notes --title "$GITHUB_REF_NAME" $prerelease
          gh release edit "$GITHUB_REF_NAME" --draft=false
